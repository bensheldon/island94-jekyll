name: New Bookmark
on:
  workflow_dispatch:
    inputs:
      bookmark_link:
        description: 'URL'
        required: true
        type: string
      bookmark_title:
        description: 'Title'
        required: false
        type: string
      bookmark_tags:
        description: 'Tags'
        required: false
        type: string
      bookmark_notes:
        description: 'Notes'
        required: false
        type: string
jobs:
  new_bookmark:
    name: Create new bookmark
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.BOT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
      # Dependencies
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Generate new bookmark
        env:
          BOOKMARK_LINK: ${{ github.event.inputs.bookmark_link }}
          BOOKMARK_TITLE: ${{ github.event.inputs.bookmark_title }}
          BOOKMARK_TAGS: ${{ github.event.inputs.bookmark_tags }}
          BOOKMARK_NOTES: ${{ github.event.inputs.bookmark_notes }}
        run: bundle exec rake new_bookmark
      - name: Create commit
        run: |
          git config user.name $GITHUB_ACTOR
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

          git add --all _bookmarks/
          git commit -m "Add bookmark for ${{ github.event.inputs.bookmark_link }}"
      - name: Push to main
        id: push
        continue-on-error: true
        run: git push origin HEAD:main
      - name: Create Pull Request
        if: steps.push.outcome == 'failure'
        id: create_pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          title: "Add bookmark for ${{ github.event.inputs.bookmark_link }}"
          body: ""
          branch-suffix: timestamp
          add-paths: |
            _bookmarks/

      - name: Summary
        run: |
          if [ "${{ steps.push.outcome }}" = "success" ]; then
            echo "- Pushed directly to main" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Push to main conflicted, opened a Pull Request instead" >> $GITHUB_STEP_SUMMARY
            echo "- Pull Request Number - ${{ steps.create_pr.outputs.pull-request-number }}" >> $GITHUB_STEP_SUMMARY
            echo "- Pull Request URL - ${{ steps.create_pr.outputs.pull-request-url }}" >> $GITHUB_STEP_SUMMARY
          fi
